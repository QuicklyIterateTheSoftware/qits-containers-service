# qits-containers client defaults, shipped from this library jar. Library jars ship defaults as
# META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties is ignored
# — read by whichever app pulls the jar in. The consuming app (250) and the environment (300)
# override any of these.
#
# THE KEYS BELOW ARE READ BY THE CONSUMER'S PRODUCER, NOT BY THIS JAR. ContainersClient is a plain
# class that takes its values in a constructor: it names no config source, injects nothing and would
# work in a process with no MicroProfile Config at all. What shipping the defaults here buys is that
# the producer is one line per value instead of one decision per value — a consumer writes
# @ConfigProperty and gets an address and three deadlines that already agree with every other
# consumer's. qits-eventstream ships its client's defaults the same way and for the same reason.

# ---------------------------------------------------------------------------------------------
# Where qits-containers answers: scheme + host + port, NO PATH. The platform shape, the same one
# qits.events.url and qits.ci.git-host-url follow — the service is a deployment fact and the path is
# the client's knowledge. ContainersClient appends /containers/api/containers/... and
# /containers/api/volumes/... itself. Setting a path here yields a doubled one and a 404 nothing
# retries out of.
#
# The default is the qits-net alias, which is right for any deployment on that network and wrong for
# a host-run process; a stack that publishes this service on a mapped localhost port overrides it.
#
# THE ENVIRONMENT IS PART OF THE ADDRESS, AND EVERY CONSUMER ALREADY KNOWS IT. There is one
# environment now and every wire alias is <env>-<application>, so the alias is DERIVED from
# QITS_ENVIRONMENT — which qits-deployments injects into every container it starts — rather than
# configured per deployment. A peer's address is not an environment-specific value a deployment
# should have to state; it is a fact about the estate's naming, and it belongs in code.
qits.containers.url=http://${QITS_ENVIRONMENT:dev}-qits-containers:8080

# How long a connection may take to establish.
#
# IT IS DECLARED HERE AND READ BY NOBODY, deliberately: the value lives in ContainersClient as a
# constant, because it belongs to the HttpClient instance rather than to a call, and that object is
# built in a field initializer where no config is in scope. The line is here so the number is
# visible beside the deadlines it interacts with — a per-call deadline shorter than the connect
# timeout is a deadline that can only ever be spent connecting. Changing this key changes nothing;
# change the constant.
qits.containers.client.connect-timeout=PT2S

# The default deadline for every call except ensure — status, list, stop, touch, logs, delete,
# destroyAll and the three volume routes. Thirty seconds because each of these is at most one docker
# call behind a registry write, and because the call sits on the CALLER's own thread: for qits-ci
# that is the single-threaded run worker between one pipeline step and the next, so this is the price
# a pipeline pays once while the orchestrator is unreachable. A caller with a tighter budget passes
# its own deadline to the method; every method takes one.
qits.containers.client.request-timeout=PT30S

# The default deadline for ensure, and it is twenty times the others on purpose: an ensure may be
# PULLING AN IMAGE. That is a registry, a network and a layer set nobody here controls, and a
# deadline that expired mid-pull would answer UNREACHABLE for a place the service is still
# successfully starting — the one answer a caller must never get wrong, because a caller that reads
# "nothing was learned" and retries starts a second workload. The service's own docker call is
# bounded independently, so this is a ceiling rather than the thing that ends a hung pull.
qits.containers.client.ensure-timeout=PT10M
