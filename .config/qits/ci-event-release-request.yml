# THE QA PIPELINE — this repository's only pipeline besides the release recipe, and it runs for
# RELEASE REQUESTS ALONE. It replaces ci-event-build.yml and ci-event-userflows.yml, both deleted in
# the commit that added this file. The reference template with the full argument is qits-ci's
# docs/ci-event-release-request.yml.
#
# Per-push CI is retired platform-wide: nothing builds a branch, because cd deploys what a RELEASE
# published rather than what a push built. qits-projects keeps, per open release request, a backing
# branch `release/<id>` — an octopus merge of the request's sources, refolded whenever the set
# changes — and publishes `ReleaseRequestChanged` on every successful re-fold. That branch is
# written by qits-githost's merge primitive, which fires no post-receive and therefore publishes no
# `SCMPublishCommit`: without this event the fold exists and nothing builds it.
#
# DECIDE AT MAIN, BUILD AT THE FOLD. The file is discovered, parsed and selected at this
# repository's `main` head; only the run's branch and sha come from the payload. So a release
# request cannot alter the CI that gates it by folding in a commit that edits this file.
#
# THE THREE STEPS ARE THE OLD TWO FILES' THREE. `ci-event-build.yml` already had two — the reactor's
# `mvn verify`, then the image — and both are gating, in that order, because a red suite must not
# cost the time of an image build. `ci-event-userflows.yml`'s single step follows them carrying
# `gating: false`, which is the whole of what that separate file was: it still fails the run and
# still shows red, and it does not hold the fold for qits-projects' build gate. Keep it LAST —
# everything after a failing step is SKIPPED.
#
# THE SHA IMAGE IS GONE. The image step ended in `docker push
# $QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-containers:$QITS_CI_SHA`, the per-push coordinate cd
# keyed on. A fold's merged sha is not a coordinate anything could deploy. The image is still BUILT
# — that is a real gate on a repository whose Dockerfile is a native build — under a local tag no
# registry can be reached by; the CalVer coordinate is ci-event-release.yml's.
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit, no tag and no image — nothing
# the fold is made of changes, so it cannot re-trigger itself. Publish-if-absent: events redeliver
# and docs versions are immutable, so 409 is success.
event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's storage coordinate is an opaque UUID since the identity
  # cutover, so a name match on repoId is not dependable. The event echoes the public name; a rename
  # updates this line in the same campaign. `suppressCi` went with the push event that carried it —
  # a release request is not a push and `-o qits.no-ci` has nothing to say about one.
  - repoName: { exact: qits-containers-service }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  # --- the GATING half, step 1: the reactor -------------------------------------------------------
  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 1800
    script: |
      set -eu
      # $QITS_CI_BRANCH is release/<id> and $QITS_CI_SHA is the merged sha — the fold is already
      # checked out, so nothing here fetches or switches refs.
      #
      # The four platform jars — qits-db-core, qits-arch-rules, qits-eventstream, qits-auth-core —
      # resolve from the platform registry; the pom's default names localhost:8081, unreachable from
      # inside a step container, and the derived address needs the exact-id mirror to pass Maven's
      # HTTP blocker (see .qits-maven-settings.xml).
      #
      # `user: build` above, and NOT a switch inside this script. The suite starts zonky's embedded
      # postgres, initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed
      # non-root user — maven-base carries one (uid 1001). It has to be chosen at `docker run`
      # because a step container is started `--cap-drop=ALL`: without CAP_SETUID and CAP_SETGID `su`
      # cannot switch user at all, and without CAP_CHOWN even root cannot chown. Measured 2026-08-12,
      # the first time this step ran: `chown: /workspace: Operation not permitted`.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL"

    # --- the GATING half, step 2: the image ---------------------------------------------------------
  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # `set -eu` is load-bearing rather than tidy: the daemon runs this with `bash -c` and no -e, so
      # without it an early failure is swallowed by the next command's exit code and the run
      # reports SUCCESS — a green verdict for a fold that does not build is exactly what a release
      # gate must never be told. -u makes an unset injected variable stop the step too.
      set -eu
      # The PLATFORM BUILDER, not the host daemon — this service is, fittingly, the service that
      # OWNS the builder it now builds through (qits-buildkit-plan.md; qits-workspace-daemon's pair
      # is the reference conversion). `build: true` keys the commissioned credential and the build
      # environment and mounts no socket. The builder's execs run on qits-net, so the maven
      # addresses below are the in-network ones every step already carries — the old --network host
      # and the host-published $QITS_REGISTRY derivation retire together.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      #
      # NOTHING IS PUSHED AND NO OUTPUT IS EXPORTED. `<registry>/<repository>/qits-containers:<sha>`
      # was the whole contract with the deployer while cd deployed a green push; it deploys a
      # RELEASE now, and the versioned coordinate is ci-event-release.yml's. What remains here is
      # the build, which is the gate — buildctl with no --output proves the image assembles and
      # leaves the warm cache the release build will hit.
      #
      # THE CREDENTIAL IS A SECRET MOUNT AND NEVER A BUILD ARG — an arg is recorded in the image
      # history. FILE form on both sides of the wire, written under umask 077 outside the clone so
      # it can never enter the build context; the Dockerfile reads /run/secrets. `:-` because the
      # pair is absent on a deployment that commissions nothing, which must stay a build that
      # resolves anonymously rather than a step that dies on -u.
      umask 077
      printf '%s' "${QITS_COMMISSIONED_CLIENT_ID:-}" > /tmp/qits-client-id
      printf '%s' "${QITS_COMMISSIONED_CLIENT_SECRET:-}" > /tmp/qits-client-secret
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret

  # --- the NON-GATING half: verify the stories, and publish what the run observed -----------------
  # ci-event-userflows.yml's step, unchanged but for `gating: false`.
  #
  # `mvn verify` at the fold — which regenerates service/target/userstories/ through the six story
  # ITs — and the reports published as one docs bundle, site @userflows/qits-containers, version =
  # the merged sha, branch riding as artifacts metadata for discovery.
  #
  # ONE STEP, BECAUSE STEPS SHARE NOTHING. Every step container clones the repository for itself, so
  # neither gating step above can hand this one a target directory: the verify and the publish stay
  # together, and the reactor really is built twice per fold. That is the price of the split and it
  # is the same price the two files paid.
  #
  # `user: build`, and NOT a switch inside the script: the suite starts zonky's embedded postgres,
  # initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed non-root
  # user — maven-base carries one (uid 1001). It has to be chosen at `docker run` because a step
  # container is started `--cap-drop=ALL`: without CAP_SETUID and CAP_SETGID `su` cannot switch user
  # at all. The step containers are Alpine, which is why BOTH poms that name zonky architectures
  # (core, service) carry the -alpine binaries as a fourth arch — `core`'s matters as much as
  # `service`'s here, because its suite runs first and a missing arch would end this step a module
  # before the IT.
  #
  # NO QUINOA FLAG, and its absence is the same decision every sibling's `-Dquarkus.quinoa=false`
  # is. This service is machine-facing and carries no client — there is no service/src/main/webui and
  # no SPA submodule — so there is no npm ritual for this step to skip and no extension to switch off.
  # The packaged fast-jar failsafe boots is exactly what ships.
  #
  # THE TWO IT FLAGS ARE THE OTHER HALF, and they are why this repository does NOT opt its service
  # module back into ITs the way qits-githost does. `skipITs` is true in the root pom because
  # ContainersRestartAdoptionIT binds to the same failsafe run: it is the docker-backed proof, it
  # starts real containers on a real daemon, and this step has no docker to offer it. The root pom's
  # `qits.it.excluded-groups` would exclude it by its `extended` tag, but it is EMPTY BY DEFAULT and
  # only the `native` profile sets it, deliberately, so that `-DskipITs=false` still means "run
  # everything". Naming the classes keeps the opt-in to this pipeline and to these stories.
  #
  # THE LIST IS THE CATALOGUE, BY NAME, AND ITS ORDER IS NOT THE RUN ORDER. Failsafe takes the classes
  # as a set; what orders them is the UserflowClassOrderer registered as junit's secondary orderer,
  # which breaks ties inside a @TestProfile group by FQCN — so the packages are named boot, lifecycle,
  # ownership, reap, refusals precisely because alphabetical is the order the diagrams assume. It is
  # spelled here newest-first-reader-first anyway, so a person reading this file reads the catalogue
  # in the order it tells its story. ContainersPackagedSurfaceIT is deliberately NOT in it: it is
  # about the artifact rather than about a story, it is a second launch of the same fast-jar, and it
  # is red on the released main for a reason of its own (AGENTS.md says which).
  #
  # NOTHING HERE REACHES A DOCKER SOCKET, in the repository whose subject is docker. The stories drive
  # real ensures, real log reads and real reaps — against stories/support/StoryDocker, a recording
  # stand-in that IS the binary qits.containers.container-runtime names, because this service spawns
  # the docker CLI rather than opening a socket. So the docker hop is drawn from evidence while this
  # step still runs in a container that has no daemon and no capability to reach one, which is the
  # repository's clone-alone rule held in the one place it is hardest to hold.
  - image: qits/build-images/maven-base:latest
    user: build
    gating: false
    timeout-seconds: 2400
    script: |
      set -eu
      # The platform registry, exactly as the first gating step derives it: the pom's default names
      # a host-published address unreachable from a step container, and the exact-id mirror in
      # .qits-maven-settings.xml is what passes Maven's HTTP blocker.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -DskipITs=false \
        "-Dit.test=TokenValidationBootstrapIT,HostBootstrapIT,WorkloadLifecycleIT,OwnershipBoundaryIT,WorkloadReapIT,AccessRefusalIT"

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL. The path is the module's, since `service` is the only module
      # with stories in it.
      tar -czf userstories.tgz -C service/target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the merged sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-containers" \
        "$QITS_DOCS_URL/@userflows/qits-containers/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-containers@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-containers@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
