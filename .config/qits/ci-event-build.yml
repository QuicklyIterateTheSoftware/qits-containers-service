# The image build, per push — moved from ci-post-receive.yml when this repo went domain-event-only,
# the switch qits-githost and qits-artifacts already made. `checkout:` makes it a move rather than a
# rewrite: the run builds the pushed branch at the pushed sha, but the pipeline is DISCOVERED at main,
# so a pushed branch can no longer alter the CI that gates it. suppressCi restates what the
# post-receive convention did with `-o qits.no-ci`. Separate from ci-event-userflows.yml on purpose:
# that run is non-gating, a red verify must not cost the image.
event: SCMPublishCommit
when:
  - repoId: { exact: qits-containers }
    suppressCi: { exact: "false" }
checkout:
  branch: branch
  sha: sha
steps:
  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 1800
    script: |
      set -eu
      # The four platform jars — qits-db-core, qits-arch-rules, qits-eventstream, qits-auth-core —
      # resolve from the platform registry; the pom's default names localhost:8081, unreachable from
      # inside a step container, and the derived address needs the exact-id mirror to pass Maven's
      # HTTP blocker (see .qits-maven-settings.xml).
      #
      # `user: build` above, and NOT a switch inside this script. The suite starts zonky's embedded
      # postgres, initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed
      # non-root user — maven-base carries one (uid 1001). It has to be chosen at `docker run`
      # because a step container is started `--cap-drop=ALL`: without CAP_SETUID and CAP_SETGID `su`
      # cannot switch user at all, and without CAP_CHOWN even root cannot chown. Measured 2026-08-12,
      # the first time this step ran: `chown: /workspace: Operation not permitted`.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL"

    # --- step 2: the image ------------------------------------------------------------------------
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # `set -eu` is load-bearing rather than tidy: the daemon runs this with `bash -c` and no -e, so
      # without it an early failure is swallowed by the next command's exit code and the run
      # reports SUCCESS. The deployer is then told an image exists that does not. -u makes an
      # unset registry variable stop the step too.
      set -eu
      # --network host, NOT a custom network: buildkit (the builder format the platform targets — a
      # swarm cannot assume the legacy builder) refuses custom networks on a build. Host networking
      # is buildkit-supported, and the maven registry's host-published address is derived from the
      # same injected env the image tag uses, so no address is stated here. The build needs it
      # because the four platform jars live only in that registry.
      #
      # Publish under the tag that is the whole contract with qits-deployments —
      # <registry>/<repository>/<this repo's name>:<sha>. The step's own container only drives the
      # docker CLI; the build and the push happen in the host's daemon through the socket this step
      # declares (docker: true).
      # THE CREDENTIAL IS A SECRET MOUNT AND NEVER A BUILD ARG — an arg is recorded in the image
      # history, and this image is pullable. The launcher injects the run's commissioned idp client
      # as $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; these two flags hand that
      # pair to the mounts on the Dockerfile's mvnw RUN, which is the only place it exists.
      # Unconditional on purpose: a missing env source is NOT an error — measured on buildx v0.36.1,
      # `--secret id=x,env=DOES_NOT_EXIST` builds green and the mounted variable is simply unset —
      # so these lines do nothing at all until a run carries the pair.
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-containers:$QITS_CI_SHA"
      docker build --network host \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        --secret id=qits-client-id,env=QITS_COMMISSIONED_CLIENT_ID \
        --secret id=qits-client-secret,env=QITS_COMMISSIONED_CLIENT_SECRET \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.
