archetype: java-service
artifacts:
  - { type: maven, name: "eu.wohlben.qits:qits-containers-client", path: client, sbom: client/target/sbom.json }
  - { type: docker, name: qits/qits-containers, sbom: .sbom/sbom.json }
userflows: qits-containers

# ONE JAR AND AN IMAGE. maven-library's header names this repository as the case that is neither
# archetype: the image half is java-service's and the jar half is maven-library's, and no recipe
# does both. The QA half is three steps rather than two — a unit gate on `maven-base` as `build`
# BEFORE the image builds, because a broken jar must not cost a native compile.
#
# THE ONE JAR IS THE CLIENT. `core` is not published (qits-795): it is an internal module carrying
# the registry, the entities and the Flyway lineage, and nothing outside this repository consumes it
# — qits-workspaces and qits-projects take only `qits-containers-client`. Its spec types and docker
# layer moved to qits-containers-driver (qits-794), which is what a runner embeds instead. The image
# still builds `core` from source (`-pl service -am` in docker/Dockerfile); only publishing stopped.
# Its released versions age out through the SBOM-closure collection, never by hand.
#
# THE MAVEN STEP IS THE LAST RELEASE STEP ON PURPOSE: qits-ci submits each declared `sbom:` from
# whichever release step holds the file, so the jar step runs after the image step and makeBom
# writes `client/target/sbom.json` there for the postlude to submit. The image's SBOM is declared
# and submitted by the postlude from the image step, as before.
release-request:
  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 1800
    script: |
      # Both addresses are code under the platform's public domain (qits-731); `wohlben.eu` covers a
      # qits-ci too old to inject $QITS_DOMAIN.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      export QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven"
      export QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL"

  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # THE ADDRESSES ARE CODE (qits-731): the platform's public domain is the one input, and every
      # host and path below is a constant under it. `wohlben.eu` covers a qits-ci too old to inject
      # $QITS_DOMAIN. `QITS_DOMAIN` rides beside the two maven urls, which stay for the Dockerfile
      # until it declares that ARG alone.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_DOMAIN="$qits_domain" \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret

  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 2400
    script: |
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      export QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven"
      export QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -DskipITs=false \
        "-Dit.test=TokenValidationBootstrapIT,HostBootstrapIT,WorkloadLifecycleIT,OwnershipBoundaryIT,WorkloadReapIT,AccessRefusalIT"
      stories_dir=$(find . -maxdepth 3 -type d -path '*/target/userstories' | head -1)
      : "${stories_dir:?the verify produced no */target/userstories}"
      tar -czf /tmp/userstories.tgz -C "$stories_dir" .
      publish_token=""
      if [ -n "${QITS_PUBLISH_TOKEN_COMMAND:-}" ] \
        && command -v "$QITS_PUBLISH_TOKEN_COMMAND" >/dev/null 2>&1; then
        publish_token=$("$QITS_PUBLISH_TOKEN_COMMAND" 2>/dev/null) || publish_token=""
      fi
      set --
      if [ -n "$publish_token" ]; then
        set -- -H "Authorization: Bearer $publish_token"
      fi

      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @/tmp/userstories.tgz "$@" \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-containers" \
        "https://registry.qits.$qits_domain/artifacts/docs/docs/@userflows/qits-containers/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-containers@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-containers@$QITS_CI_SHA are already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac

release:
  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      declared=$(sed -n \
        's/^[[:space:]]*-[[:space:]]*{[[:space:]]*type:[[:space:]]*docker[[:space:]]*,[[:space:]]*name:[[:space:]]*\([^,}[:space:]]*\).*/\1/p' \
        .config/qits/release.yml)
      image=${declared#*/}
      # THE ADDRESSES ARE CODE (qits-731): the platform's public domain is the one input, and every
      # host and path below is a constant under it. `wohlben.eu` covers a qits-ci too old to inject
      # $QITS_DOMAIN.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      ref="registry.qits.$qits_domain/$QITS_IMAGE_REPOSITORY/$image:$QITS_VERSION"
      echo "releasing $ref"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_DOMAIN="$qits_domain" \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$ref,push=true"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:QITS_DOMAIN="$qits_domain" \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=.sbom

  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      # NO LONGER A DEPLOY: the CLI publishes the client coordinate from the postlude, off the
      # jar this step leaves in target/. This step only has to build it, and it moves after
      # the image step so it is the LAST release step, which is where the postlude publishes from.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      export QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven"
      export QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central"
      ./mvnw -B -ntp -s .qits-maven-settings.xml -pl client -am package -DskipTests \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL"
      ./mvnw -B -ntp -s .qits-maven-settings.xml -pl client -DskipTests \
        org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom \
        -DoutputFormat=json -DoutputName=sbom -DschemaVersion=1.6 \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL"

