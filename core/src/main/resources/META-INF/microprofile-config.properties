# qits-containers domain defaults, shipped from this library jar. Library jars ship defaults as
# META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties is ignored
# — read by whichever app pulls the jar in. The consuming app (250) and the environment (300)
# override any of them.
#
# `core` owns its OWN named datasource + persistence unit + Flyway lineage: its own postgres
# database, never sharing another module's store or its migration history. The suite points the same
# three keys at an embedded postgres (see EmbeddedPgConfigSource in the service module's test
# sources).
#
# THE THREE KEYS BELOW ARE THE PLATFORM'S GENERIC RESOURCE CONTRACT, not an invention of this repo.
# The repository's .config/qits/deployments.yml carries `resources: postgresql:db`; qits-deployments
# creates the role and the database on the tier's postgres before the successor container starts and
# injects QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD. An application maps those generic variables
# in its own shipped defaults, which is this block — the deployer stays framework-agnostic and knows
# nothing about Quarkus datasource keys.
#
# THE TRIPLE HAS NO DEFAULTS AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming what is missing,
# rather than opening some fallback store nobody meant. For this service the loud failure is worth
# more than for most: the registry rows ARE the record of which containers may exist, and an
# orchestrator that booted on an empty database it invented would see every running container as
# unnamed by any row.
quarkus.datasource.containers.db-kind=postgresql
quarkus.datasource.containers.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.containers.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.containers.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER, WHICH STOCK AGROAL DOES NOT. Replacing the tier's postgres
# severs every pooled connection; without validation the pool hands a dead one to the next caller
# long after the database is back, and 5s of acquisition is not enough for the successor to take the
# alias.
#
# The driver line is the one that makes a request WAIT instead of fail: PatientPgDriver delegates to
# org.postgresql.Driver and, while the database is not there, keeps asking for up to 14s — under the
# 15s below, so a caller that outlasts it gets the database's real refusal rather than a generic
# acquisition timeout. It retries only "not there" (SQLState 08*, and 57P03 while postgres is
# starting up); a wrong password fails at once. The url stays a plain jdbc:postgresql: one.
#
# ALL THREE LINES OR NONE — each does less than it reads as without the other two, and
# DatasourceBaselineTest fails this build if one goes missing.
quarkus.datasource.containers.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.containers.jdbc.acquisition-timeout=15S
quarkus.datasource.containers.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to the containers datasource, owning only this module's
# entities. `packages` assigns entity->PU unambiguously; there is no default datasource in this app
# at all, and a NAMED persistence unit names its own datasource rather than falling back to one.
quarkus.hibernate-orm.containers.datasource=containers
quarkus.hibernate-orm.containers.packages=eu.wohlben.qits.containers.entity

# Own Flyway lineage at a distinct classpath location, hand-written and appended to.
#
# baseline-on-migrate is deliberately absent. Every database this lineage meets is either empty or
# was created by this lineage, so the flag would only mask the one case worth failing on — a schema
# somebody else put there.
quarkus.flyway.containers.migrate-at-start=true
quarkus.flyway.containers.locations=classpath:db/containers/migration

# --- the registry's own behaviour ----------------------------------------------------------------
# How often the observation pass runs, on the single ct-worker. 0 switches it off entirely, and then
# a row's state is whatever the operation that wrote it said — which is a real answer for a
# deployment that wants no background writes, not a broken one. Nothing ticks in test mode at all:
# the observer returns early on a LaunchMode.TEST boot, so the suite drives observeOnce() itself and
# this value keeps its shipped number there.
qits.containers.observe-interval-seconds=30

# How long a settled row is kept before it is pruned — desired ABSENT and observed GONE only, so a
# prune can never drop a row that still names a container. Generous on purpose: this table is what a
# person reads after an incident, and a week is what makes last Tuesday answerable.
qits.containers.row-prune-horizon=P7D

# RESERVED AND DELIBERATELY NOT READ. The volume reconcile is row-driven rather than clock-driven —
# it removes only a volume whose own row asks to be absent, and reports every unclaimed one without
# touching it — because docker volume labels carry no creation time and the two ways to invent one
# are both worse than not collecting (VolumeReconcile's javadoc argues both). The key stays here for
# the day a creation time exists to compare against; until then nothing injects it.
qits.containers.volume-gc-grace=P7D

# Which binary the driver shells out to. Read by the real driver in `service` (WP4); it is here
# because it is a property of this domain's docker seam rather than of one deployable.
qits.containers.container-runtime=docker

# Which group owns the host's docker socket, for the workloads that declared the bind — rendered as
# `--group-add` beside `-v /var/run/docker.sock:...` and nowhere else. IT IS NORMALLY UNSET: the
# service holds the socket, so it reads the group off the socket itself (DockerSocketGroup), which is
# the same unix:gid the platform bootstrap reads when it decides which group to start this service
# in. Set it only where the socket's own path does not report the group that opens it.
#
# Why it is needed at all: the socket is srw-rw---- owned by that group, so a container holding the
# bind and running as anybody but root is refused on connect. qits-ci never met this (its opted-in
# steps run as the image's root); a workspace container runs as the host uid and does.
# qits.containers.docker-socket-group=

# The network this service's workloads are addressed on. IT IS ASKED ABOUT AND NEVER CREATED: a
# network invented here would be one no other module's containers are on, and a bridge cannot be
# created on a swarm-initialized host at all. A boot step warns when it is absent and the service
# carries on, because the answer is a deployment's and not an orchestrator's.
qits.containers.network=qits-net

# The platform's shared volumes — the coding agent's home, the maven repository, the pnpm store. A
# boot step makes sure they exist, with NO row and NO label: a row would claim them and a claim is
# what makes a volume removable, while a label would put them in the volume reconcile's listing,
# where every pass would report three unclaimed volumes forever. They are the platform's, and a
# workload mounts them through sharedMounts precisely because they are not its own.
#
# Underscores, because that is what they are called on the host — which is why a volume name is
# allowed a wider charset than a container name.
qits.containers.shared-volumes=qits_shared_dot_claude,qits_shared_m2,qits_shared_pnpm

# --- the platform builder -------------------------------------------------------------------------
# THE ONE CONTAINER THIS SERVICE CREATES FOR ITSELF: buildkitd, on the platform network, so image
# builds stop needing the host's docker socket. Ensured at boot the way the shared volumes are —
# warned about, never failed on, claimed by no row (PlatformBuildkit's javadoc argues the whole
# shape). ON by default, because the recoverable state is the one worth defaulting to and one
# variable reverses it (QITS_CONTAINERS_BUILDKIT_ENABLED=false); qits-ci carries the fleet-facing
# kill switch beside it, and a converted recipe fails loudly rather than silently building through
# the socket when either is off.
qits.containers.buildkit.enabled=true

# The version pin of the whole build plane. Resolved by the HOST daemon (registry-mirrors routes it
# through the platform mirror's hub namespace), so the bare upstream name is right here — the same
# reading as a step image's FROM. Bump it here and in the step images' buildctl stage in ONE
# campaign; the client tolerates minor skew but nobody should have to remember that.
qits.containers.buildkit.image=moby/buildkit:v0.33.0

# What a socket-holding workload is handed as $BUILDKIT_HOST. The name half is the
# ContainersIdentifiers.PLATFORM_BUILDER constant (it is also the docker exec belt for the cache
# sweep and must stay closed); the key exists because an address is a deployment's to move, a name
# is not. 1234 is buildkitd's own conventional port, bound 0.0.0.0 inside the container.
qits.containers.buildkit.address=tcp://qits-buildkitd:1234

# What keeps every committed Dockerfile's FROM lines and in-build RUN dials working from the
# platform network. The edge vhosts (and the two host-published ports older files spell) resolve
# only in the host's namespace, so buildkitd rewrites them to the in-network aliases; the aliases
# speak plain HTTP, which is the same intra-network posture every other platform hop is under.
# docker.io is deliberately NOT mapped: no committed Dockerfile pulls a bare Hub name, and a bare
# `FROM alpine` under buildctl resolving Docker Hub directly is the loud form of a reference the
# offline posture forbids — spell the mirror instead.
#
# THE ALIASES ARE MEASURED, NOT GUESSED, and the measurement cost the first converted release run
# (2026-09-05): the registry is dev-qits-artifacts (qits-artifacts is a dev-TIER application, so it
# carries the tier alias every environment service does), while the mirror is the platform-tier
# qits-platform-mirror. A `qits-platform-artifacts` spelling resolves NOWHERE on qits-net and the
# builder failed every base pull with a DNS error naming it. Both endpoints answer /v2 anonymously
# over plain HTTP — verified before these values were written down.
qits.containers.buildkit.registry-mirrors=registry.dev.localhost:8080=dev-qits-artifacts:8080,mirror.dev.localhost:8080=qits-platform-mirror:8080,localhost:8081=dev-qits-artifacts:8080,localhost:8082=qits-platform-mirror:8080
qits.containers.buildkit.http-registries=dev-qits-artifacts:8080,qits-platform-mirror:8080

# The builder's own standing bound (buildkitd.toml gckeepstorage, bytes); the orchestrator-driven
# POST /gc/build-cache sweep is the belt over it and uses the host cache's keep-storage number for
# this builder — since the migration this IS the platform's build cache.
qits.containers.buildkit.keep-storage-bytes=20000000000

# The container's own bounds. No memory cap: a native-image build inside a step wants ~6g and the
# per-step sandbox already bounds the step; oom-score-adj positive so the kernel takes the build
# plane before a platform service — a reaped builder retries, a reaped registry does not.
qits.containers.buildkit.pids-limit=4096
qits.containers.buildkit.oom-score-adj=500

# What an exec inside a build resolves names with. 127.0.0.11 is docker's embedded DNS, a constant
# of every user-defined network, and the builder's [dns] toml section pins it because BuildKit's
# generated resolv.conf FILTERS loopback nameservers out — right for its default sandbox namespace,
# which cannot reach them, and wrong for this builder, whose execs share the container's namespace
# (worker networkMode=host) where the embedded DNS is exactly what serves the platform aliases.
# Measured 2026-09-05: without this line, networkMode=host still died on name resolution. The
# embedded DNS forwards what it does not own upstream, so public names resolve through it too.
qits.containers.buildkit.exec-nameservers=127.0.0.11

# --- the data plane, and why it ships off ---------------------------------------------------------
# THE REVERSE TUNNEL IS A SKELETON AND THIS KEY IS THE GATE. False, everywhere, until a consumer
# migrates onto it: no loopback listener is bound, the control socket refuses every dial with a
# close reason naming this key, and the dial-back route answers 404. On, the surface in
# `service/.../proxy` is live — see the README's "The data plane".
#
# It is a key of the DOMAIN rather than of one deployable, for the same reason the docker seam's
# runtime name is: what a place's `endpoint.proxy` means is this service's answer, not a
# deployment's. A deployment turns it on with QITS_CONTAINERS_PROXY_ENABLED=true.
qits.containers.proxy.enabled=false

# How long a minted stream nonce stays claimable. Generous for a docker network and short for a
# bearer credential; the only thing that happens inside the window is one WebSocket dial. A nonce
# nobody claims closes the parked connection, which turns a daemon that never came into a connection
# error at the caller rather than a request that hangs until some other timeout notices.
qits.containers.proxy.nonce-ttl-ms=10000

# Which run of this service started a container — the value of the qits.containers.instance label.
# A DIAGNOSTIC, never a filter a sweep acts on: adopting is the rule, so "started by an earlier
# instance" must never be readable as "removable". A deployment running two instances against one
# docker daemon overrides it so the two are distinguishable in `docker ps`; they still cannot reap
# each other, because reaping reads rows and not labels.
qits.containers.instance=qits-containers
